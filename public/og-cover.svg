<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Rich Premium Midnight Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="45%" stop-color="#1E1B4B" />
      <stop offset="85%" stop-color="#3B0764" />
      <stop offset="100%" stop-color="#110726" />
    </linearGradient>

    <!-- Glowing Metallic Gold Gradient for CAREER & Logo -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Secondary Text Purple Glow -->
    <linearGradient id="purpleTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <!-- Trail Dash Arc Gradient -->
    <linearGradient id="trailGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.1" />
      <stop offset="40%" stop-color="#A855F7" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#EC4899" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FDE047" stop-opacity="1" />
    </linearGradient>

    <!-- Filters for Intense Glow Effect -->
    <filter id="glowGoldLarge" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#F59E0B" flood-opacity="0.65"/>
    </filter>

    <filter id="glowPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="30" flood-color="#A855F7" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 1. Deep Midnight Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="600" cy="315" r="350" fill="#7C3AED" opacity="0.22" filter="blur(110px)" />
  <circle cx="850" cy="200" r="280" fill="#F59E0B" opacity="0.18" filter="blur(100px)" />
  <circle cx="250" cy="450" r="260" fill="#EC4899" opacity="0.15" filter="blur(95px)" />

  <!-- Subtle Futuristic Grid Lines -->
  <path d="M0 150 L1200 150 M0 315 L1200 315 M0 480 L1200 480" stroke="rgba(255,255,255,0.03)" stroke-width="1.5"/>
  <path d="M300 0 L300 630 M600 0 L600 630 M900 0 L900 630" stroke="rgba(255,255,255,0.03)" stroke-width="1.5"/>

  <!-- 2. FLIGHT TRAJECTORY ARC (Đường bay lượn của máy bay giấy) -->
  <path d="M 80 520 C 300 500, 420 380, 640 320 C 820 270, 960 190, 1080 110" 
        fill="none" 
        stroke="url(#trailGrad)" 
        stroke-width="7" 
        stroke-dasharray="14 10" 
        stroke-linecap="round" 
        filter="url(#glowPurple)" />

  <!-- Sparkle stars along flight path -->
  <path d="M 380 430 L 386 436 L 380 442 L 374 436 Z" fill="#FDE047" opacity="0.8"/>
  <path d="M 680 290 L 688 298 L 680 306 L 672 298 Z" fill="#EC4899" opacity="0.9"/>
  <path d="M 920 170 L 928 178 L 920 186 L 912 178 Z" fill="#FDE047" opacity="0.9"/>

  <!-- 3. TOP BRAND HEADER: P MARCOM LOGO -->
  <g transform="translate(80, 65)" filter="url(#glowGoldLarge)">
    <!-- Golden P Logo Box -->
    <rect width="68" height="68" rx="20" fill="url(#goldGrad)" />
    <!-- Paper Plane cutout in P logo -->
    <path fill="#0B0F19" d="M20 17 L50 34 L32 41 L28 50 L24 43 L20 17 Z" />
    <path fill="url(#goldGrad)" d="M32 41 L42 35 L28 50 Z" opacity="0.95" />
    
    <!-- Brand Text -->
    <text x="86" y="32" fill="url(#goldGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="26" letter-spacing="2">P MARCOM</text>
    <text x="86" y="52" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" letter-spacing="3">CAREER ORIENTATION PLATFORM</text>
  </g>

  <!-- 4. CENTERPIECE: HUGE "CAREER" TYPOGRAPHY -->
  <g transform="translate(600, 345)" filter="url(#glowGoldLarge)">
    <!-- Giant Glowing CAREER Text -->
    <text x="0" y="0" 
          fill="url(#goldGrad)" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-weight="900" 
          font-size="150" 
          letter-spacing="6" 
          text-anchor="middle">
      CAREER
    </text>
  </g>

  <!-- Subtitle Tagline below CAREER -->
  <g transform="translate(600, 425)" filter="url(#glowPurple)">
    <text x="0" y="0" 
          fill="url(#purpleTextGrad)" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-weight="800" 
          font-size="28" 
          letter-spacing="6" 
          text-anchor="middle">
      ĐỊNH HƯỚNG PHÁT TRIỂN NGHỀ NGHIỆP
    </text>
  </g>

  <!-- Tagline Badge below Subtitle -->
  <g transform="translate(600, 480)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    <text x="0" y="5" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" text-anchor="middle" letter-spacing="1">
      Hệ Thống Đánh Giá DISC &amp; Holland Code (RIASEC) Chuẩn Hoa Kỳ
    </text>
  </g>

  <!-- 5. LARGE STYLIZED 3D FLYING PAPER PLANE (Máy bay giấy cất cánh vút cao) -->
  <g transform="translate(980, 140) rotate(-28)" filter="url(#glowGoldLarge)">
    <!-- Plane Glow Aura -->
    <circle cx="0" cy="0" r="90" fill="#F59E0B" opacity="0.25" filter="blur(35px)" />

    <!-- Main Plane Body Upper Wing -->
    <path d="M -75 0 L 85 -40 L -25 -55 Z" fill="#FFFFFF" stroke="#F8FAFC" stroke-width="2" />
    
    <!-- Lower Main Wing -->
    <path d="M -75 0 L 85 -40 L -25 40 Z" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2" />
    
    <!-- Fold Shadow & Underwing Gold Accents -->
    <path d="M -75 0 L 85 -40 L -10 0 Z" fill="#CBD5E1" />
    <path d="M -25 40 L 15 8 L 85 -40 Z" fill="url(#goldGrad)" opacity="0.9" />

    <!-- Dynamic Speed Trails -->
    <line x1="-120" y1="-15" x2="-85" y2="-15" stroke="#FDE047" stroke-width="4" stroke-linecap="round" />
    <line x1="-140" y1="15" x2="-95" y2="15" stroke="#EC4899" stroke-width="4" stroke-linecap="round" />
    <line x1="-110" y1="40" x2="-80" y2="40" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- 6. FOOTER BRANDING -->
  <text x="600" y="585" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" text-anchor="middle" letter-spacing="1">
    Bản quyền thuộc về P Marcom • Đồng hành cùng sự phát triển nghề nghiệp
  </text>
</svg>
