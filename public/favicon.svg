<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gold / Amber Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    
    <!-- Background Dark Indigo Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Glass Lens Inner Glow -->
    <radialGradient id="lensGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#4F46E5" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.0" />
    </radialGradient>

    <!-- Drop Shadow for Icon -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.25" />

  <!-- Magnifying Glass Icon (Kính Lúp) -->
  <g filter="url(#glow)">
    <!-- Lens Circle Fill -->
    <circle cx="225" cy="225" r="105" fill="url(#lensGrad)" />
    
    <!-- Lens Circle Ring -->
    <circle cx="225" cy="225" r="105" fill="none" stroke="url(#goldGrad)" stroke-width="36" />
    
    <!-- Handle -->
    <line x1="302" y1="302" x2="400" y2="400" stroke="url(#goldGrad)" stroke-width="44" stroke-linecap="round" />
    
    <!-- Lens Glass Reflection Arc -->
    <path d="M170 160 A70 70 0 0 1 275 180" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.65" />
    
    <!-- Sparkle inside lens -->
    <path d="M225 185 L231 205 L251 211 L231 217 L225 237 L219 217 L199 211 L219 205 Z" fill="#FEF08A" opacity="0.9" />
  </g>
</svg>
